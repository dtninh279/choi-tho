<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khu Vườn Thỏ & Cà Rốt - Toán Lớp 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            background: linear-gradient(180deg, #7dd3fc 0%, #bae6fd 45%, #fef9c3 65%, #86efac 65%, #4ade80 100%);
            min-height: 100vh;
        }

        /* Hoạt họa khung cảnh nền */
        @keyframes sunSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes cloudFloat {
            0% { transform: translateX(-120px); }
            100% { transform: translateX(calc(100vw + 120px)); }
        }
        @keyframes flowerSway {
            0%, 100% { transform: rotate(-6deg); }
            50% { transform: rotate(6deg); }
        }
        @keyframes butterflyFly1 {
            0%, 100% { transform: translate(0, 0) rotate(5deg); }
            25% { transform: translate(40px, -25px) rotate(-10deg); }
            50% { transform: translate(85px, -5px) rotate(8deg); }
            75% { transform: translate(45px, 15px) rotate(-5deg); }
        }
        @keyframes butterflyFly2 {
            0%, 100% { transform: translate(0, 0) scaleX(-1) rotate(5deg); }
            33% { transform: translate(-50px, -20px) scaleX(-1) rotate(-12deg); }
            66% { transform: translate(-20px, -35px) scaleX(-1) rotate(10deg); }
        }
        @keyframes wingFlap {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(0.35); }
        }

        .sun-rays {
            transform-origin: center;
            animation: sunSpin 35s linear infinite;
        }
        .cloud-1 { animation: cloudFloat 48s linear infinite; }
        .cloud-2 { animation: cloudFloat 65s linear infinite; animation-delay: -20s; }
        .cloud-3 { animation: cloudFloat 55s linear infinite; animation-delay: -38s; }
        .flower-sway {
            transform-origin: bottom center;
            animation: flowerSway 3.2s ease-in-out infinite;
        }
        .butterfly-1 { animation: butterflyFly1 9s ease-in-out infinite; }
        .butterfly-2 { animation: butterflyFly2 11s ease-in-out infinite; }
        .wing-flap {
            transform-origin: center;
            animation: wingFlap 0.25s ease-in-out infinite;
        }

        /* Hoạt họa chú thỏ */
        @keyframes rabbitIdle {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(-5px) scaleY(1.03); }
        }
        @keyframes earWiggleLeft {
            0%, 85%, 100% { transform: rotate(0deg); }
            90% { transform: rotate(-9deg); }
            95% { transform: rotate(4deg); }
        }
        @keyframes earWiggleRight {
            0%, 80%, 100% { transform: rotate(0deg); }
            86% { transform: rotate(8deg); }
            92% { transform: rotate(-3deg); }
        }
        @keyframes eyeBlink {
            0%, 92%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.1); }
        }
        @keyframes rabbitShake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-10px) rotate(-7deg); }
            40% { transform: translateX(10px) rotate(7deg); }
            60% { transform: translateX(-8px) rotate(-5deg); }
            80% { transform: translateX(8px) rotate(5deg); }
        }
        @keyframes rabbitHappyJump {
            0%, 100% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-28px) scale(1.12); }
            50% { transform: translateY(-10px) scale(1.05); }
            75% { transform: translateY(-20px) scale(1.1); }
        }

        .rabbit-wrapper {
            touch-action: none;
            cursor: grab;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
        }
        .rabbit-idle .rabbit-body-group {
            animation: rabbitIdle 2.2s ease-in-out infinite;
            transform-origin: bottom center;
        }
        .ear-left {
            transform-origin: 48px 46px;
            animation: earWiggleLeft 4.5s ease-in-out infinite;
        }
        .ear-right {
            transform-origin: 72px 46px;
            animation: earWiggleRight 5.2s ease-in-out infinite;
        }
        .rabbit-eye {
            transform-origin: center;
            animation: eyeBlink 4s infinite;
        }
        .rabbit-dragging {
            cursor: grabbing !important;
            z-index: 999 !important;
            filter: drop-shadow(0 18px 16px rgba(0, 0, 0, 0.28));
        }
        .rabbit-shake {
            animation: rabbitShake 0.55s ease-in-out;
        }
        .rabbit-happy {
            animation: rabbitHappyJump 0.8s ease-out;
        }

        /* Hoạt họa giỏ cà rốt */
        @keyframes sparkleTwinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.7) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.25) rotate(25deg); }
        }
        @keyframes basketPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .sparkle-1 { animation: sparkleTwinkle 1.8s ease-in-out infinite; transform-origin: center; }
        .sparkle-2 { animation: sparkleTwinkle 2.3s ease-in-out infinite 0.6s; transform-origin: center; }
        .sparkle-3 { animation: sparkleTwinkle 2.1s ease-in-out infinite 1.2s; transform-origin: center; }
        
        .basket-zone {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
            animation: basketPulse 3s ease-in-out infinite;
        }
        .basket-zone.hovered {
            animation: none;
            transform: scale(1.12);
            filter: drop-shadow(0 0 24px rgba(250, 204, 21, 0.95));
        }

        /* Bong bóng hội thoại & Hiệu ứng hạt */
        @keyframes popIn {
            0% { opacity: 0; transform: translate(-50%, 10px) scale(0.6); }
            70% { opacity: 1; transform: translate(-50%, -4px) scale(1.06); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
        .speech-bubble {
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes floatUpFade {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-65px) scale(1.3); }
        }
        .floating-praise {
            animation: floatUpFade 1.2s ease-out forwards;
            pointer-events: none;
        }
    </style>
</head>

                <!-- SVG Giỏ mây & Cà rốt mọng nước -->

                            <stop offset="50%" stop-color="#f97316"/>
                            <stop offset="100%" stop-color="#ea580c"/>

        <!-- Hàng dưới: 3 chú thỏ -->

    </main>

    <!-- CANVAS PHÁO HOA / CONFETTI -->
    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

    <!-- MODAL CHIẾN THẮNG RỰC RỠ -->
    <div id="victory-modal" class="fixed inset-0 z-40 hidden items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
        <div class="bg-gradient-to-b from-amber-50 to-white rounded-3xl max-w-md w-full p-6 sm:p-8 text-center shadow-2xl border-4 border-amber-400 transform scale-95 transition-all">
            <div class="w-24 h-24 mx-auto mb-3 bg-gradient-to-tr from-amber-400 to-yellow-300 rounded-full flex items-center justify-center shadow-lg border-4 border-white text-5xl animate-bounce">
                🏆
            </div>
            <h2 class="text-2xl sm:text-3xl font-black text-emerald-700 mb-2">Hoan hô! Bé giỏi quá!</h2>
            <p class="text-slate-600 font-bold text-sm sm:text-base mb-5">
                Bé đã tìm đúng cả <span class="text-orange-600 font-black">4 chú thỏ</span> có phép tính bằng 4 và thưởng cho các bạn ấy những củ cà rốt giòn ngọt!
            </p>
            
            <!-- Tổng kết 4 phép tính đúng -->

                <div class="bg-white py-1.5 rounded-xl shadow-xs">6 - 2 = 4 🥕</div>

            <button onclick="resetGame()" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white font-black text-lg shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">

    <script>
        // ==========================================
        // 1. HỆ THỐNG ÂM THANH (WEB AUDIO API)
        // ==========================================
        let soundEnabled = true;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-icon').textContent = soundEnabled ? '🔊' : '🔇';
        }

        // Âm thanh nhấc chú thỏ lên ("pop" nhẹ)
        function playPickupSound() {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(340, now);
            osc.frequency.exponentialRampToValueAtTime(560, now + 0.09);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.09);
        }

        // Âm thanh thả ĐÚNG ("ting!" + tiếng nhai cà rốt vui tai)
        function playSuccessSound() {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            
            // Hợp âm chuông ngân vui vẻ (C5 - E5 - G5 - C6)
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.065);
                gain.gain.setValueAtTime(0.22, now + idx * 0.065);
                gain.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.065 + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.065);
                osc.stop(now + idx * 0.065 + 0.35);
            });
        }

        // Âm thanh thả SAI ("boing!" nhẹ nhàng, thân thiện)
        function playBoingSound() {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(280, now);
            osc.frequency.exponentialRampToValueAtTime(160, now + 0.14);
            osc.frequency.exponentialRampToValueAtTime(240, now + 0.28);
            osc.frequency.exponentialRampToValueAtTime(140, now + 0.42);
            
            gain.gain.setValueAtTime(0.22, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.42);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.42);
        }

        // Âm thanh chiến thắng rộn ràng
        function playVictoryFanfare() {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            const melody = [
                { f: 523.25, t: 0, d: 0.14 },
                { f: 659.25, t: 0.14, d: 0.14 },
                { f: 783.99, t: 0.28, d: 0.14 },
                { f: 1046.50, t: 0.42, d: 0.35 },
                { f: 783.99, t: 0.78, d: 0.15 },
                { f: 1046.50, t: 0.95, d: 0.5 }
            ];
            melody.forEach(n => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(n.f, now + n.t);
                gain.gain.setValueAtTime(0.24, now + n.t);
                gain.gain.exponentialRampToValueAtTime(0.01, now + n.t + n.d);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + n.t);
                osc.stop(now + n.t + n.d);
            });
        }

        // ==========================================
        // 2. DỮ LIỆU 6 CHÚ THỎ & ĐỒ HỌA SVG TÙY CHỈNH
        // ==========================================
        const RABBITS_DATA = [
            {
                id: 'r1',

                row: 'bottom',
                furMain: '#a7f3d0',

                result: 4,

        const PRAISE_WORDS = ['Giỏi quá! ⭐', 'Chính xác! 🎉', 'Tuyệt vời! 🥕', 'Xuất sắc! 💖'];
        let foundCount = 0;
        const TOTAL_CORRECT = 4;

        // Tạo SVG chi tiết cho từng chú thỏ
        function createRabbitSVG(r, state = 'normal') {
            // state: 'normal' | 'happy' | 'confused'
            const eyesSVG = state === 'happy'
                ? `
                    <!-- Mắt ngôi sao / trái tim vui sướng -->
                    <path d="M44 63 L46 66 L50 66 L47 68 L48 72 L44 70 L40 72 L41 68 L38 66 L42 66 Z" fill="#ef4444"/>
                    <path d="M76 63 L78 66 L82 66 L79 68 L80 72 L76 70 L72 72 L73 68 L70 66 L74 66 Z" fill="#ef4444"/>
                `
                : state === 'confused'
                ? `
                    <!-- Mắt ngơ ngác -->
                    <circle cx="45" cy="67" r="4.5" fill="#1e293b"/>
                    <circle cx="43.5" cy="65.5" r="1.5" fill="#ffffff"/>
                    <circle cx="75" cy="67" r="4.5" fill="#1e293b"/>
                    <circle cx="76.5" cy="65.5" r="1.5" fill="#ffffff"/>
                    <path d="M39 59 L50 62 M81 59 L70 62" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
                `
                : `
                    <!-- Mắt long lanh tự nhiên -->
                    <g class="rabbit-eye">
                        <ellipse cx="45" cy="67" rx="4.2" ry="5" fill="#1e293b"/>
                        <circle cx="43.5" cy="65" r="1.7" fill="#ffffff"/>
                        <ellipse cx="75" cy="67" rx="4.2" ry="5" fill="#1e293b"/>
                        <circle cx="73.5" cy="65" r="1.7" fill="#ffffff"/>
                    </g>
                `;

            const mouthSVG = state === 'happy'
                ? `<path d="M53 76 Q60 85 67 76 Z" fill="#f43f5e" stroke="#881337" stroke-width="1.5"/>`
                : state === 'confused'
                ? `<path d="M55 79 Q60 75 65 79" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>`
                : `<path d="M53 76 Q57 80 60 76 Q63 80 67 76" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>`;

            const bowSVG = r.hasBow
                ? `
                    <!-- Chiếc nơ đỏ xinh xắn trên đầu -->
                    <g transform="translate(76, 42) rotate(18)">
                        <path d="M0 0 L-13 -8 C-16 -2 -16 4 -13 8 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.8"/>
                        <path d="M0 0 L13 -8 C16 -2 16 4 13 8 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.8"/>
                        <circle cx="0" cy="0" r="4.5" fill="#fca5a5" stroke="#991b1b" stroke-width="1.8"/>
                    </g>
                `
                : '';

            const carrotPropSVG = state === 'happy'
                ? `
                    <!-- Củ cà rốt thỏ đang ăn ngon lành -->
                    <g transform="translate(86, 86) rotate(32)">
                        <path d="M-2 -6 Q-6 -18 0 -20 Q4 -12 0 -6" fill="#22c55e"/>
                        <path d="M-7 0 C-7 -6 7 -6 7 0 L2 26 C1 29 -1 29 -2 26 Z" fill="#f97316" stroke="#9a3412" stroke-width="1.5"/>
                    </g>
                `
                : '';

            return `
                <svg viewBox="0 0 120 155" class="w-24 h-32 sm:w-32 sm:h-40 overflow-visible pointer-events-none">
                    <!-- Bóng đổ dưới chân thỏ -->
                    <ellipse cx="60" cy="146" rx="34" ry="7" fill="rgba(20, 83, 45, 0.22)"/>

                    <g class="rabbit-body-group">
                        <!-- Đuôi bông xù -->
                        <circle cx="92" cy="126" r="10" fill="${r.belly}" stroke="${r.furStroke}" stroke-width="2.5"/>

                        <!-- Tai trái -->
                        <g class="ear-left">
                            <ellipse cx="45" cy="26" rx="10" ry="24" transform="rotate(-10 45 26)" fill="${r.furMain}" stroke="${r.furStroke}" stroke-width="2.8"/>
                            <ellipse cx="45" cy="27" rx="5" ry="17" transform="rotate(-10 45 27)" fill="${r.earInner}"/>
                        </g>

                        <!-- Tai phải -->
                        <g class="ear-right">
                            <ellipse cx="75" cy="26" rx="10" ry="24" transform="rotate(10 75 26)" fill="${r.furMain}" stroke="${r.furStroke}" stroke-width="2.8"/>
                            <ellipse cx="75" cy="27" rx="5" ry="17" transform="rotate(10 75 27)" fill="${r.earInner}"/>
                        </g>

                        <!-- Thân thỏ mũm mĩm -->
                        <ellipse cx="60" cy="114" rx="32" ry="30" fill="${r.furMain}" stroke="${r.furStroke}" stroke-width="2.8"/>
                        <ellipse cx="60" cy="117" rx="22" ry="21" fill="${r.belly}"/>

                        <!-- Bàn chân sau -->
                        <ellipse cx="40" cy="141" rx="12" ry="6.5" fill="${r.furMain}" stroke="${r.furStroke}" stroke-width="2.5"/>
                        <ellipse cx="80" cy="141" rx="12" ry="6.5" fill="${r.furMain}" stroke="${r.furStroke}" stroke-width="2.5"/>

                        <!-- Đầu thỏ bầu bĩnh -->
                        <ellipse cx="60" cy="66" rx="31" ry="25" fill="${r.furMain}" stroke="${r.furStroke}" stroke-width="2.8"/>

                        ${bowSVG}

                        <!-- Má hồng & Mũi -->
                        <ellipse cx="37" cy="74" rx="5.5" ry="3.2" fill="#fb7185" opacity="0.55"/>
                        <ellipse cx="83" cy="74" rx="5.5" ry="3.2" fill="#fb7185" opacity="0.55"/>
                        <ellipse cx="60" cy="72" rx="4" ry="2.8" fill="#f43f5e"/>

                        ${eyesSVG}
                        ${mouthSVG}

                        <!-- Bảng gỗ trước ngực ghi phép tính rõ nét -->
                        <g transform="translate(60, 114)">
                            <rect x="-34" y="-17" width="68" height="34" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
                            <rect x="-30" y="-13" width="60" height="26" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3 2"/>
                            <text x="0" y="7" text-anchor="middle" font-size="21" font-weight="900" fill="#1e293b" letter-spacing="0.5">${r.expr}</text>
                        </g>

                        <!-- Hai bàn tay nhỏ ôm bảng gỗ -->
                        <ellipse cx="26" cy="113" rx="7.5" ry="6" fill="${r.furMain}" stroke="${r.furStroke}" stroke-width="2.5"/>
                        <ellipse cx="94" cy="113" rx="7.5" ry="6" fill="${r.furMain}" stroke="${r.furStroke}" stroke-width="2.5"/>

                        ${carrotPropSVG}
                    </g>
                </svg>
            `;
        }

        // ==========================================
        // 3. KHỞI TẠO & RENDER GIAO DIỆN
        // ==========================================
        function renderProgressCarrots() {
            const container = document.getElementById('carrot-progress');
            container.innerHTML = '';
            for (let i = 0; i < TOTAL_CORRECT; i++) {
                const earned = i < foundCount;
                const badge = document.createElement('div');
                badge.className = `w-7 h-7 sm:w-8 sm:h-8 rounded-full flex items-center justify-center text-base sm:text-lg transition-all duration-300 ${
                    earned
                        ? 'bg-orange-100 border-2 border-orange-400 scale-110 shadow-sm'
                        : 'bg-slate-200/70 border-2 border-slate-300 opacity-45 grayscale'
                }`;
                badge.textContent = '🥕';
                container.appendChild(badge);
            }
        }

        function renderRabbits() {
            const topContainer = document.getElementById('top-rabbits');
            const bottomContainer = document.getElementById('bottom-rabbits');
            topContainer.innerHTML = '';
            bottomContainer.innerHTML = '';

            RABBITS_DATA.forEach((r, idx) => {
                const wrapper = document.createElement('div');
                wrapper.id = `rabbit-${r.id}`;
                wrapper.dataset.id = r.id;
                wrapper.className = 'rabbit-wrapper rabbit-idle relative flex flex-col items-center justify-center';
                wrapper.style.animationDelay = `${idx * 0.25}s`;
                wrapper.innerHTML = createRabbitSVG(r, 'normal');

                setupPointerDrag(wrapper, r);

                if (r.row === 'top') {
                    topContainer.appendChild(wrapper);
                } else {
                    bottomContainer.appendChild(wrapper);
                }
            });
        }

        // ==========================================
        // 4. LOGIC KÉO THẢ MƯỢT MÀ (POINTER EVENTS)
        // ==========================================
        function setupPointerDrag(el, rabbitData) {
            let isDragging = false;
            let startX = 0;
            let startY = 0;
            let currentX = 0;
            let currentY = 0;

            const basketZone = document.getElementById('basket-dropzone');

            el.addEventListener('pointerdown', (e) => {
                if (el.dataset.solved === 'true') return;
                e.preventDefault();
                initAudio();
                playPickupSound();

                isDragging = true;
                el.setPointerCapture(e.pointerId);
                el.classList.remove('rabbit-idle', 'rabbit-shake');
                el.classList.add('rabbit-dragging');

                startX = e.clientX - currentX;
                startY = e.clientY - currentY;

                el.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.1) rotate(5deg)`;
            });

            el.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                e.preventDefault();

                currentX = e.clientX - startX;
                currentY = e.clientY - startY;

                // Nghiêng nhẹ theo hướng di chuyển
                const tilt = Math.max(-14, Math.min(14, currentX * 0.06));
                el.style.transform = `translate(${currentX}px, ${currentY}px) scale(1.12) rotate(${tilt}deg)`;

                // Kiểm tra va chạm với vùng giỏ cà rốt
                if (isOverBasket(el, basketZone)) {
                    basketZone.classList.add('hovered');
                } else {
                    basketZone.classList.remove('hovered');
                }
            });

            const endDrag = (e) => {
                if (!isDragging) return;
                isDragging = false;
                el.classList.remove('rabbit-dragging');
                basketZone.classList.remove('hovered');

                const droppedInBasket = isOverBasket(el, basketZone);

                if (droppedInBasket) {
                    if (rabbitData.isCorrect) {
                        handleCorrectDrop(el, rabbitData);
                    } else {
                        handleWrongDrop(el, rabbitData);
                    }
                } else {
                    // Thả ra ngoài: nhẹ nhàng bay về chỗ cũ
                    currentX = 0;
                    currentY = 0;
                    el.style.transform = 'translate(0px, 0px) scale(1) rotate(0deg)';
                    el.classList.add('rabbit-idle');
                }
            };

            el.addEventListener('pointerup', endDrag);
            el.addEventListener('pointercancel', endDrag);
        }

        function isOverBasket(rabbitEl, basketEl) {
            const rRect = rabbitEl.getBoundingClientRect();
            const bRect = basketEl.getBoundingClientRect();

            const rCenterX = rRect.left + rRect.width / 2;
            const rCenterY = rRect.top + rRect.height / 2;

            // Mở rộng vùng nhận diện thêm 20px cho bé dễ thả
            const padding = 20;
            return (
                rCenterX >= bRect.left - padding &&
                rCenterX <= bRect.right + padding &&
                rCenterY >= bRect.top - padding &&
                rCenterY <= bRect.bottom + padding
            );
        }

        // Xử lý khi thả ĐÚNG (kết quả = 4)
        function handleCorrectDrop(el, rabbitData) {
            el.dataset.solved = 'true';
            playSuccessSound();

            // Đưa thỏ về vị trí gốc với biểu cảm hạnh phúc & củ cà rốt
            el.style.transform = 'translate(0px, 0px) scale(1) rotate(0deg)';
            el.innerHTML = createRabbitSVG(rabbitData, 'happy') + `
                <div class="mt-0.5 bg-emerald-600 text-white text-[11px] sm:text-xs font-black px-2.5 py-0.5 rounded-full shadow border border-white">
                    ${rabbitData.expr} = 4 ✓
                </div>
            `;
            el.classList.add('rabbit-happy');

            // Hiệu ứng chữ khen ngợi bay lên tại giỏ cà rốt
            const basketZone = document.getElementById('basket-dropzone');
            const bRect = basketZone.getBoundingClientRect();
            const praiseText = PRAISE_WORDS[foundCount % PRAISE_WORDS.length];
            spawnFloatingPraise(bRect.left + bRect.width / 2, bRect.top + 10, praiseText);
            burstMiniStars(bRect.left + bRect.width / 2, bRect.top + bRect.height / 2);

            foundCount++;
            renderProgressCarrots();

            // Kiểm tra hoàn thành tất cả 4 chú thỏ
            if (foundCount >= TOTAL_CORRECT) {
                setTimeout(() => {
                    playVictoryFanfare();
                    launchVictoryConfetti();
                    const modal = document.getElementById('victory-modal');
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                }, 900);
            }
        }

        // Xử lý khi thả SAI (7 - 2 hoặc 9 - 4)
        function handleWrongDrop(el, rabbitData) {
            playBoingSound();

            // Nhảy bật trở lại vị trí cũ & lắc đầu ngơ ngác
            el.style.transform = 'translate(0px, 0px) scale(1) rotate(0deg)';
            el.innerHTML = createRabbitSVG(rabbitData, 'confused');
            el.classList.add('rabbit-shake');

            // Bong bóng suy nghĩ nhắc nhẹ
            const bubble = document.createElement('div');
            bubble.className = 'speech-bubble absolute -top-9 left-1/2 -translate-x-1/2 bg-white text-rose-600 border-2 border-rose-400 px-3 py-1 rounded-2xl text-xs sm:text-sm font-black shadow-lg whitespace-nowrap z-30';
            bubble.innerHTML = `💭 ${rabbitData.wrongHint}`;
            el.appendChild(bubble);

            setTimeout(() => {
                bubble.remove();
                el.classList.remove('rabbit-shake');
                el.innerHTML = createRabbitSVG(rabbitData, 'normal');
                el.classList.add('rabbit-idle');
            }, 1900);
        }

        // Hiệu ứng chữ khen ngợi bay lên
        function spawnFloatingPraise(x, y, text) {
            const tag = document.createElement('div');
            tag.className = 'floating-praise fixed z-50 bg-amber-400 text-amber-950 border-2 border-white px-4 py-1.5 rounded-full font-black text-base sm:text-lg shadow-xl';
            tag.style.left = `${x}px`;
            tag.style.top = `${y}px`;
            tag.style.transform = 'translateX(-50%)';
            tag.textContent = text;
            document.body.appendChild(tag);
            setTimeout(() => tag.remove(), 1250);
        }

        // ==========================================
        // 5. HIỆU ỨNG PHÁO HOA SAO & CONFETTI (CANVAS)
        // ==========================================
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animFrameId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function burstMiniStars(x, y) {
            const colors = ['#facc15', '#fb923c', '#4ade80', '#f472b6', '#38bdf8'];
            for (let i = 0; i < 24; i++) {
                const angle = (Math.PI * 2 * i) / 24 + Math.random() * 0.2;
                const speed = 3 + Math.random() * 5;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 2,
                    size: 6 + Math.random() * 6,
                    color: colors[i % colors.length],
                    alpha: 1,
                    gravity: 0.18,
                    shape: 'star',
                    rotation: Math.random() * Math.PI
                });
            }
            if (!animFrameId) animateParticles();
        }

        function launchVictoryConfetti() {
            const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: -20 - Math.random() * canvas.height * 0.5,
                    vx: (Math.random() - 0.5) * 4,
                    vy: 2.5 + Math.random() * 4,
                    size: 7 + Math.random() * 7,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    gravity: 0.06,
                    shape: Math.random() > 0.4 ? 'rect' : 'star',
                    rotation: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.15
                });
            }
            if (!animFrameId) animateParticles();
        }

        function drawStar(cx, cy, spikes, outerR, innerR, color, alpha, rot) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(cx, cy);
            ctx.rotate(rot);
            ctx.beginPath();
            for (let i = 0; i < spikes * 2; i++) {
                const r = i % 2 === 0 ? outerR : innerR;
                const angle = (i * Math.PI) / spikes;
                if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
                else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
            }
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.rotation += p.vRot || 0.05;
                if (p.shape === 'star' && p.gravity > 0.1) {
                    p.alpha -= 0.022;
                } else if (p.y > canvas.height) {
                    p.alpha = 0;
                }

                if (p.alpha > 0) {
                    if (p.shape === 'star') {
                        drawStar(p.x, p.y, 5, p.size, p.size * 0.45, p.color, p.alpha, p.rotation);
                    } else {
                        ctx.save();
                        ctx.globalAlpha = p.alpha;
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rotation);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.65);
                        ctx.restore();
                    }
                }
            });

            particles = particles.filter((p) => p.alpha > 0);
            if (particles.length > 0) {
                animFrameId = requestAnimationFrame(animateParticles);
            } else {
                animFrameId = null;
            }
        }

        // ==========================================
        // 6. KHỞI ĐỘNG / CHƠI LẠI TRÒ CHƠI
        // ==========================================
        function resetGame() {
            foundCount = 0;
            particles = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const modal = document.getElementById('victory-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');

            renderProgressCarrots();
            renderRabbits();
        }

        window.onload = function () {
            resetGame();
        };
    </script>
</body>
